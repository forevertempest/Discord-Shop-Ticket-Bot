<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#131924"/>
      <stop offset="100%" stop-color="#0f141c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#7983F5"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#181b22"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="16" fill="url(#grid)"/>

  <!-- Subtle Glow -->
  <circle cx="240" cy="190" r="220" fill="#5865F2" opacity="0.08"/>
  <circle cx="920" cy="190" r="190" fill="#3ba55c" opacity="0.05"/>

  <!-- Left Accent Bar -->
  <rect x="64" y="88" width="6" height="92" rx="3" fill="url(#accent)"/>

  <!-- Title & Subtitle -->
  <text x="90" y="132" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
    Shop Ticket Bot
  </text>
  <text x="90" y="168" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500">
    Discord Components V2 • Order &amp; Giveaway Ticket System
  </text>

  <!-- Feature Pills -->
  <g transform="translate(90, 206)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="148" height="32" rx="8" fill="#1f2430" stroke="#30363d" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#5865F2"/>
    <text x="30" y="21" fill="#c9d1d9">Components V2</text>

    <rect x="160" y="0" width="136" height="32" rx="8" fill="#1f2430" stroke="#30363d" stroke-width="1"/>
    <circle cx="178" cy="16" r="4" fill="#3ba55c"/>
    <text x="190" y="21" fill="#c9d1d9">DM Seller Flow</text>

    <rect x="308" y="0" width="138" height="32" rx="8" fill="#1f2430" stroke="#30363d" stroke-width="1"/>
    <circle cx="326" cy="16" r="4" fill="#faa61a"/>
    <text x="338" y="21" fill="#c9d1d9">Auto Archiving</text>
  </g>

  <!-- Channel Status Strip -->
  <g transform="translate(90, 262)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600">
    <rect x="0" y="0" width="446" height="40" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <circle cx="22" cy="20" r="5" fill="#ed4245"/>
    <text x="34" y="24" fill="#8b949e">заказ-user</text>
    <text x="122" y="24" fill="#484f58">→</text>
    <circle cx="148" cy="20" r="5" fill="#5865F2"/>
    <text x="160" y="24" fill="#8b949e">в работе</text>
    <text x="234" y="24" fill="#484f58">→</text>
    <circle cx="260" cy="20" r="5" fill="#99aab5"/>
    <text x="272" y="24" fill="#8b949e">выполнен</text>
    <text x="352" y="24" fill="#484f58">/</text>
    <circle cx="374" cy="20" r="5" fill="#4f545c"/>
    <text x="386" y="24" fill="#8b949e">отмена</text>
  </g>

  <!-- Right Side: Mock Discord Components V2 Container -->
  <g transform="translate(650, 56)">
    <!-- Outer V2 Container -->
    <rect x="0" y="0" width="486" height="268" rx="12" fill="url(#cardBg)" stroke="#2f3542" stroke-width="1.5"/>

    <!-- Section Header + Server Avatar Thumbnail -->
    <text x="24" y="40" fill="#f2f3f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="19" font-weight="700">
      Заказ — customer_name
    </text>
    <text x="24" y="64" fill="#949ba4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5">
      Тип заказа: Заказ дизайна • Статус: В работе
    </text>

    <!-- Thumbnail Accessory -->
    <rect x="410" y="20" width="52" height="52" rx="12" fill="#2b2d31" stroke="#3f4248" stroke-width="1"/>
    <path d="M426 46 L434 54 L448 38" fill="none" stroke="#5865F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Codeblock Preview 1 -->
    <text x="24" y="96" fill="#b5bac1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">
      Желает заказать:
    </text>
    <rect x="24" y="104" width="438" height="38" rx="6" fill="#111214" stroke="#232428" stroke-width="1"/>
    <text x="36" y="128" fill="#dbdee1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5">
      Оформление профиля и баннера сервера
    </text>

    <!-- Codeblock Preview 2 -->
    <text x="24" y="164" fill="#b5bac1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">
      Желаемый тип оплаты:
    </text>
    <rect x="24" y="172" width="438" height="34" rx="6" fill="#111214" stroke="#232428" stroke-width="1"/>
    <text x="36" y="194" fill="#dbdee1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5">
      USDT / СБП
    </text>

    <!-- ActionRow V2 Buttons -->
    <g transform="translate(24, 220)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">
      <rect x="0" y="0" width="124" height="32" rx="6" fill="#35373c" stroke="#4e5058" stroke-width="1"/>
      <text x="28" y="21" fill="#f2f3f5">Выполнен</text>

      <rect x="136" y="0" width="128" height="32" rx="6" fill="#35373c" stroke="#4e5058" stroke-width="1"/>
      <text x="26" y="21" fill="#f2f3f5">Отказаться</text>
    </g>
  </g>
</svg>
